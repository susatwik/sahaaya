<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Indian Family Illustration">
  <defs>
    <linearGradient id="famBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#E7F7EF"/>
    </linearGradient>
    <linearGradient id="motherSaree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="fatherKurta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="skinTone1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2A77A"/>
      <stop offset="100%" stop-color="#CA8C5E"/>
    </linearGradient>
    <linearGradient id="skinTone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D49363"/>
      <stop offset="100%" stop-color="#B87747"/>
    </linearGradient>
  </defs>

  <!-- Circular Soft Background Badge -->
  <circle cx="160" cy="120" r="105" fill="url(#famBg)"/>
  <circle cx="160" cy="120" r="104" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Father Figure (Right) -->
  <g transform="translate(160, 45)">
    <!-- Hair -->
    <ellipse cx="40" cy="32" rx="18" ry="16" fill="#1C1917"/>
    <!-- Head -->
    <circle cx="40" cy="38" r="16" fill="url(#skinTone2)"/>
    <!-- Eyes, nose, smile, mustache -->
    <ellipse cx="35" cy="36" rx="2" ry="2.5" fill="#1C1917"/>
    <ellipse cx="45" cy="36" rx="2" ry="2.5" fill="#1C1917"/>
    <path d="M39 37 L 41 42" stroke="#8D5B33" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mustache -->
    <path d="M34 44 Q 40 42 46 44 Q 40 47 34 44 Z" fill="#1C1917"/>
    <path d="M36 47 Q 40 50 44 47" stroke="#1C1917" stroke-width="1" fill="none"/>

    <!-- Father Body / Kurta -->
    <path d="M15 65 C 22 55, 58 55, 65 65 L 75 140 L 5 140 Z" fill="url(#fatherKurta)"/>
    <path d="M32 58 L 48 58 L 48 85 L 32 85 Z" fill="#F8FAFC" opacity="0.9"/>
  </g>

  <!-- Mother Figure (Center-Left) -->
  <g transform="translate(85, 45)">
    <!-- Bun -->
    <circle cx="30" cy="40" r="14" fill="#24140E"/>
    <!-- Head -->
    <circle cx="45" cy="42" r="16" fill="url(#skinTone1)"/>
    <!-- Hair Front -->
    <path d="M30 38 C 35 28, 55 28, 60 38 C 55 32, 45 32, 30 38 Z" fill="#1C1917"/>
    <!-- Bindi -->
    <circle cx="45" cy="35" r="2" fill="#BE123C"/>
    <!-- Eyes, Nose, Smile -->
    <ellipse cx="40" cy="41" rx="2" ry="2.5" fill="#1C1917"/>
    <ellipse cx="50" cy="41" rx="2" ry="2.5" fill="#1C1917"/>
    <path d="M44 42 L 46 46" stroke="#9A6137" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M41 49 Q 45 53 49 49" stroke="#9F1239" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Mother Saree / Dress -->
    <path d="M22 68 C 30 58, 65 58, 72 68 L 85 140 L 10 140 Z" fill="url(#motherSaree)"/>
    <!-- Gold Border on Saree -->
    <path d="M25 66 Q 48 85 70 120" stroke="#FDE047" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Baby in Mother's Arms (Center) -->
  <g transform="translate(130, 100)">
    <!-- Swaddling Cloth (Warm Yellow) -->
    <path d="M5 25 Q 25 10 45 25 Q 40 55 25 60 Q 10 55 5 25 Z" fill="#FEF08A"/>
    <!-- Baby Head -->
    <circle cx="25" cy="20" r="11" fill="url(#skinTone1)"/>
    <!-- Baby Hair Tuft -->
    <path d="M24 8 Q 26 5 28 8" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
    <!-- Baby Face -->
    <ellipse cx="21" cy="20" rx="1.5" ry="1.8" fill="#1C1917"/>
    <ellipse cx="29" cy="20" rx="1.5" ry="1.8" fill="#1C1917"/>
    <path d="M23 24 Q 25 27 27 24" stroke="#BE123C" stroke-width="1.2" fill="none"/>
    <!-- Mother Caring Arm Holding Baby -->
    <path d="M-5 25 Q 15 45 35 40" stroke="url(#skinTone1)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="-2" cy="26" r="3" fill="#F59E0B"/>
  </g>

  <!-- Young Child / Daughter (Front Left) -->
  <g transform="translate(60, 115)">
    <!-- Hair Pigtails -->
    <circle cx="20" cy="30" r="6" fill="#1C1917"/>
    <circle cx="50" cy="30" r="6" fill="#1C1917"/>
    <!-- Head -->
    <circle cx="35" cy="35" r="13" fill="url(#skinTone1)"/>
    <!-- Eyes, smile -->
    <ellipse cx="31" cy="35" rx="1.5" ry="2" fill="#1C1917"/>
    <ellipse cx="39" cy="35" rx="1.5" ry="2" fill="#1C1917"/>
    <path d="M32 41 Q 35 44 38 41" stroke="#E11D48" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Dress (Green) -->
    <path d="M20 52 L 50 52 L 58 75 L 12 75 Z" fill="#10B981"/>
  </g>
</svg>
