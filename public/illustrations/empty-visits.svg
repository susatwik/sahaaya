<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="280" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F9F1"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Soft circular backdrop -->
  <circle cx="140" cy="100" r="88" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative stars/sparkles -->
  <path d="M60 45 Q62 55 72 57 Q62 59 60 69 Q58 59 48 57 Q58 55 60 45Z" fill="#10B981" opacity="0.6"/>
  <path d="M225 60 Q226 66 232 68 Q226 70 225 76 Q224 70 218 68 Q224 66 225 60Z" fill="#059669" opacity="0.5"/>
  <circle cx="70" cy="140" r="5" fill="#34D399" opacity="0.4"/>
  <circle cx="215" cy="135" r="6" fill="#34D399" opacity="0.4"/>

  <!-- Clipboard -->
  <g filter="url(#softShadow)">
    <rect x="85" y="42" width="110" height="135" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <!-- Clipboard metal clip -->
    <rect x="115" y="32" width="50" height="18" rx="6" fill="#047857"/>
    <rect x="128" y="36" width="24" height="8" rx="3" fill="#D1FAE5"/>

    <!-- Checklist rows with checkmarks -->
    <g transform="translate(100, 62)">
      <!-- Row 1 -->
      <circle cx="10" cy="10" r="8" fill="#D1FAE5"/>
      <path d="M6 10 L9 13 L15 7" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="25" y="7" width="48" height="6" rx="3" fill="#94A3B8"/>

      <!-- Row 2 -->
      <circle cx="10" cy="30" r="8" fill="#D1FAE5"/>
      <path d="M6 30 L9 33 L15 27" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="25" y="27" width="40" height="6" rx="3" fill="#94A3B8"/>

      <!-- Row 3 -->
      <circle cx="10" cy="50" r="8" fill="#D1FAE5"/>
      <path d="M6 50 L9 53 L15 47" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="25" y="47" width="45" height="6" rx="3" fill="#94A3B8"/>
      
      <!-- Row 4 -->
      <circle cx="10" cy="70" r="8" fill="#D1FAE5"/>
      <path d="M6 70 L9 73 L15 67" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="25" y="67" width="35" height="6" rx="3" fill="#94A3B8"/>
    </g>
  </g>

  <!-- Big golden celebration badge at bottom right -->
  <g transform="translate(170, 125)" filter="url(#softShadow)">
    <circle cx="25" cy="25" r="24" fill="#10B981"/>
    <circle cx="25" cy="25" r="20" fill="#059669"/>
    <!-- Ribbon tails -->
    <path d="M14 42 L10 56 L19 50 L25 56 L24 43" fill="#047857"/>
    <path d="M26 43 L25 56 L31 50 L40 56 L36 42" fill="#047857"/>
    <!-- Checkmark inside badge -->
    <path d="M18 25 L23 30 L32 19" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
