<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="jaBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#jaBg)"/>

  <!-- Subtle healthcare decorative shapes -->
  <circle cx="50" cy="60" r="30" fill="#C7D2FE" opacity="0.4"/>
  <circle cx="350" cy="240" r="45" fill="#C7D2FE" opacity="0.4"/>
  <path d="M340 50 Q342 60 352 62 Q342 64 340 74 Q338 64 328 62 Q338 60 340 50Z" fill="#6366F1" opacity="0.5"/>

  <!-- Field Handbook (Left, angled) -->
  <g transform="rotate(-6 140 160)" filter="url(#cardShadow)">
    <rect x="70" y="80" width="130" height="170" rx="10" fill="#4338CA"/>
    <!-- Handbook spine -->
    <rect x="70" y="80" width="18" height="170" rx="4" fill="#312E81"/>
    <!-- Page edges -->
    <rect x="88" y="86" width="106" height="158" rx="6" fill="#F8FAFC"/>
    <!-- Handbook header badge -->
    <rect x="100" y="102" width="80" height="20" rx="5" fill="#EEF2FF"/>
    <path d="M108 112 L112 116 L120 108" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="126" y="110" width="45" height="5" rx="2" fill="#4F46E5"/>
    <!-- Content lines -->
    <rect x="100" y="135" width="82" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="100" y="150" width="70" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="100" y="165" width="76" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="100" y="180" width="60" height="6" rx="3" fill="#CBD5E1"/>
    <!-- Red ribbon bookmark -->
    <path d="M140 76 L140 105 L146 100 L152 105 L152 76 Z" fill="#EF4444"/>
  </g>

  <!-- Digital Tablet / Field App (Right) -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="55" width="160" height="210" rx="14" fill="url(#tabletGrad)" stroke="#334155" stroke-width="3"/>
    <rect x="190" y="70" width="140" height="175" rx="8" fill="#FFFFFF"/>
    <!-- Tablet App Header -->
    <rect x="190" y="70" width="140" height="32" fill="#173F91"/>
    <circle cx="206" cy="86" r="6" fill="#159B78"/>
    <rect x="220" y="83" width="70" height="6" rx="3" fill="#FFFFFF"/>
    
    <!-- Checklist items inside tablet -->
    <g transform="translate(202, 115)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="7" fill="#E7F7EF"/>
      <path d="M5 8 L7 10 L12 5" stroke="#159B78" stroke-width="2" stroke-linecap="round"/>
      <rect x="22" y="5" width="90" height="6" rx="3" fill="#475569"/>

      <!-- Item 2 -->
      <circle cx="8" cy="28" r="7" fill="#E7F7EF"/>
      <path d="M5 28 L7 30 L12 25" stroke="#159B78" stroke-width="2" stroke-linecap="round"/>
      <rect x="22" y="25" width="80" height="6" rx="3" fill="#475569"/>

      <!-- Item 3 -->
      <circle cx="8" cy="48" r="7" fill="#EAF3FF"/>
      <path d="M5 48 L7 50 L12 45" stroke="#173F91" stroke-width="2" stroke-linecap="round"/>
      <rect x="22" y="45" width="85" height="6" rx="3" fill="#475569"/>

      <!-- Item 4 -->
      <circle cx="8" cy="68" r="7" fill="#FFF3DF"/>
      <circle cx="8" cy="68" r="2.5" fill="#D97706"/>
      <rect x="22" y="65" width="70" height="6" rx="3" fill="#94A3B8"/>

      <!-- Action Button at bottom of tablet -->
      <rect x="10" y="90" width="100" height="22" rx="6" fill="#159B78"/>
      <rect x="36" y="98" width="48" height="5" rx="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Stethoscope looping over the bottom -->
  <path d="M120 220 C110 270 240 280 250 250" stroke="#0EA5E9" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="120" cy="220" r="6" fill="#0284C7"/>
</svg>
