<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <circle cx="40" cy="40" r="38" fill="#EAF3FF"/>
  <!-- Vaccine Vial -->
  <rect x="18" y="32" width="16" height="28" rx="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
  <rect x="21" y="27" width="10" height="5" rx="1.5" fill="#38BDF8"/>
  <line x1="21" y1="44" x2="31" y2="44" stroke="#0284C7" stroke-width="2"/>
  <rect x="21" y="47" width="10" height="9" fill="#E0F2FE"/>
  <!-- Syringe Diagonal -->
  <g transform="rotate(45 50 38)">
    <rect x="42" y="22" width="12" height="28" rx="2" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="48" y1="12" x2="48" y2="22" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="43" y1="12" x2="53" y2="12" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="50" x2="48" y2="62" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Liquid in Syringe -->
    <rect x="44" y="34" width="8" height="14" fill="#38BDF8"/>
    <!-- Measurement ticks -->
    <line x1="42" y1="28" x2="45" y2="28" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="42" y1="34" x2="46" y2="34" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="42" y1="40" x2="45" y2="40" stroke="#0284C7" stroke-width="1.5"/>
  </g>
  <!-- Vaccine Droplet -->
  <path d="M56 16 C 53 21, 51 24, 51 26 C 51 29, 53 31, 56 31 C 59 31, 61 29, 61 26 C 61 24, 59 21, 56 16 Z" fill="#0284C7"/>
</svg>
