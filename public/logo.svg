    <path id="logoBody" d="M 50 78 C 47.5 73, 46 64, 45 56 C 39.5 53, 34 48.5, 30.5 42 C 29 39.5, 31.5 38, 33.5 39.5 C 37.5 42, 42.5 46.5, 46.5 49 C 47.5 47, 48.5 45.5, 50 45.5 C 51.5 45.5, 52.5 47, 53.5 49 C 57.5 46.5, 62.5 42, 66.5 39.5 C 68.5 38, 71 39.5, 69.5 42 C 66 48.5, 60.5 53, 55 56 C 54 64, 52.5 73, 50 78 Z" fill="#FFFFFF" />
  </g>
</svg>
