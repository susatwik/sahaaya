      <stop stop-color="#2563EB" />
      <stop offset="1" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="logoTealGrad" x1="85" y1="20" x2="50" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#159B78" />
      <stop offset="1" stop-color="#0D7A5C" />
