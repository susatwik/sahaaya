  </defs>
  <!-- Left Blue Half -->
  <path id="logoLeftFill" d="M 50 24 C 38 12, 16 14, 12 34 C 8 52, 22 69, 38 79 C 44 83, 48 86, 50 87 L 50 24 Z" fill="url(#logoBlueGrad)" />
